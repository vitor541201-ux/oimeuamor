<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Te amo</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700;1,9..144,900&family=Caveat:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1230;--bg2:#3d1a40;--rose:#ff8fab;--butter:#ffe29a;--paper:#fff6e6;--ink:#4a2144;--muted:#d9b8d6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--paper);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;min-height:100vh}
header{text-align:center;padding:12vh 1rem 4rem}
h1{font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:900;font-size:clamp(4.2rem,22vw,12rem);line-height:.9;margin:0;color:var(--rose);letter-spacing:-.02em;text-shadow:0 .04em 0 #b3405f,0 .09em 0 #7a2a45}
h1 span{display:inline-block;animation:bob 3.2s ease-in-out infinite}
h1 span:nth-child(2){animation-delay:.15s}h1 span:nth-child(3){animation-delay:.3s}
h1 .sp{width:.25em}
@keyframes bob{50%{transform:translateY(-.06em) rotate(-1.5deg)}}
.sub{font-family:'Caveat',cursive;font-size:1.7rem;color:var(--butter);margin:2rem 0 0}
.hint{color:var(--muted);font-size:.95rem;margin:.4rem 0 0}
main{max-width:980px;margin:0 auto;padding:0 1.2rem 5rem}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:2rem 1.5rem}
.env{all:unset;cursor:pointer;position:relative;display:block;aspect-ratio:3/2;background:var(--paper);border-radius:6px;box-shadow:0 10px 24px #0006;transition:transform .25s}
.env:nth-child(odd){transform:rotate(-1.5deg)}.env:nth-child(even){transform:rotate(1.2deg)}
.env:hover,.env:focus-visible{transform:translateY(-6px) rotate(0)}
.env:focus-visible{outline:3px solid var(--butter);outline-offset:4px}
.env::before{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(135deg,transparent 49.5%,#e9d7c0 50%) left/50% 100% no-repeat,linear-gradient(225deg,transparent 49.5%,#e9d7c0 50%) right/50% 100% no-repeat}
.flap{position:absolute;left:0;right:0;top:0;height:58%;background:#f1e0c9;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .45s}
.env.open .flap{transform:rotateX(180deg)}
.seal{position:absolute;left:50%;top:46%;width:2.4rem;height:2.4rem;margin:-1.2rem;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:1.1rem;box-shadow:0 2px 5px #0004;z-index:2}
.lbl{position:absolute;left:0;right:0;bottom:.7rem;text-align:center;font-family:'Caveat',cursive;font-size:1.45rem;line-height:1.1;color:var(--ink);padding:0 .8rem;z-index:2}
dialog{border:0;padding:0;background:none;max-width:min(520px,94vw);width:100%;color:var(--ink);overflow:visible}
dialog::backdrop{background:#1a0a1ecc}
.letter{background:var(--paper) repeating-linear-gradient(transparent 0 1.9rem,#ecd9c3 1.9rem calc(1.9rem + 1px));border-radius:6px;padding:1.8rem 1.6rem 1.6rem;max-height:86vh;overflow:auto;box-shadow:0 20px 50px #000a;animation:rise .4s ease-out}
@keyframes rise{from{transform:translateY(24px) scale(.96);opacity:0}}
.letter h2{font-family:'Caveat',cursive;font-size:2rem;line-height:1.1;margin:0 0 .8rem;color:#b3405f}
.letter p{margin:0 0 .9rem;line-height:1.9rem;font-size:1.02rem}
.letter figure{margin:0 0 1rem;transform:rotate(-1.5deg);background:#fff;padding:.6rem .6rem .3rem;box-shadow:0 4px 12px #0003;max-width:300px;margin-inline:auto}
.letter img{display:block;width:100%;height:auto}
.letter figcaption{font-family:'Caveat',cursive;font-size:1.3rem;text-align:center;padding:.2rem 0}
.sign{font-family:'Caveat',cursive;font-size:1.6rem;text-align:right;color:#b3405f}
.x{all:unset;cursor:pointer;display:block;margin:1rem auto 0;color:var(--butter);font-family:'Caveat',cursive;font-size:1.5rem}
.x:focus-visible{outline:2px solid var(--butter);outline-offset:4px}
footer{text-align:center;color:var(--muted);padding:0 1rem 3rem;font-family:'Caveat',cursive;font-size:1.4rem}
@media(prefers-reduced-motion:reduce){h1 span,.letter{animation:none}.flap,.env{transition:none}}
</style>
</head>
<body>
<header>
<h1 aria-label="Te amo"><span>T</span><span>E</span><span class="sp"></span><span>A</span><span>M</span><span>O</span></h1>
<p class="sub">programei umas cartinhas pra você</p>
<p class="hint">toque para abrir. uma de cada vez, só quando precisar. ( Mas eu sei que você vai ver todas agora kkk )</p>
</header>
<main>
<div class="grid" id="grid"></div>
</main>
<footer>Sem pressa meu amor. Agora a gente chega lá junto.</footer>
<dialog id="dlg"><div class="letter" id="letter"></div><button class="x" id="close">fechar a carta</button></dialog>

{t:"abra quando quiser um motivo pra sorrir",f:true,c:[
"Olha essa foto. Noite qualquer, cabelo fora do lugar, ninguém posando direito, e mesmo assim todo mundo sorrindo. É isso que eu quero guardar, nesse dia tinha uma única certeza e era a que eu queria me apaixonar cada vez mais por vocês dois.",
"Quando eu penso no nosso futuro como família, não imagino nada de cinema. Imagino uma mesa meio bagunçada, almoço de domingo que passa das três da tarde, e alguém contando a mesma história pela quinta vez enquanto todo mundo finge que nunca ouviu.",
"Imagino a gente crescendo junto: cada um virando mais do que é hoje, e a nossa futura casa cada vez mais barulhenta do jeito bom. Fotos novas, mesma bagunça, o mesmo abraço apertado e beijo lento de sempre.",
"Não precisa dar tudo certo o tempo todo. Só precisa ser com vocês."],cap:"nós, um dia antes do namoro"},
{t:"abra quando o dia estiver pesado",c:["Respira. Você não precisa resolver o dia inteiro agora, só o próximo passo.","Dia ruim é só um dia ruim: não diz nada sobre quem você é. Toma uma água, COME alguma coisa que eu sei que você não comeu e se dá o mesmo desconto que daria pro Davi se ele tivesse com um dia ruim.","Amanhã é uma folha em branco. E eu tô aqui, com a caneta, se você quiser."]},
{t:"abra quando duvidar de você",c:["Lembra de todas as vezes que você achou que não ia dar e deu? Eu lembro de todas.","Você é mais capaz do que o seu cansaço deixa você enxergar. Medo não é sinal de que você não consegue: é sinal de que importa.","Vai no seu ritmo. Eu acredito em você mesmo quando você esquece de acreditar."]},
{t:"abra quando sentir saudade",c:["Eu também. Pode ter certeza.","Distância é só um intervalo, não um ponto final. Já, já a gente tá no mesmo sofá, brigando porquê alguém dormiu na parte boa do filme. ( provavelmente você )","Enquanto isso, pensa em algo bobo que eu disse. Se você riu, minha missão foi cumprida."]},

var g=document.getElementById('grid'),dlg=document.getElementById('dlg'),L=document.getElementById('letter'),cur=null;
cartas.forEach(function(c,i){
 var b=document.createElement('button');b.className='env';
 b.innerHTML='<span class="flap"></span><span class="seal">♥</span><span class="lbl">'+c.t.replace(/^abra /,'<small style="font-size:.8em;opacity:.7">abra </small>')+'</span>';
 b.setAttribute('aria-label','Carta: '+c.t);
 b.onclick=function(){cur=b;b.classList.add('open');setTimeout(function(){show(c);},380)};
 g.appendChild(b);
});
function show(c){
 var h='<h2>'+c.t+'…</h2>';
 if(c.f)h+='<figure><img src="'+IMG+'" alt="Foto de nós, um dia antes do namoro"><figcaption>'+c.cap+'</figcaption></figure>';
 c.c.forEach(function(p){h+='<p>'+p+'</p>'});
 h+='<div class="sign">com amor ♥<br>Seu Rebelde</div>';
 L.innerHTML=h;L.scrollTop=0;
 if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
}
function fechar(){dlg.close();if(cur)cur.classList.remove('open')}
document.getElementById('close').onclick=fechar;
dlg.addEventListener('close',function(){if(cur)cur.classList.remove('open')});
dlg.addEventListener('click',function(e){if(e.target===dlg)fechar()});
</script>
